services:
  api:
    build: ./services/trackflow-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/trackflow-api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  backoffice:
    build:
      context: .
      dockerfile: uis/backoffice/Dockerfile
    ports:
      - "3002:3000"
    depends_on:
      - api

  telemetry-pipeline:
    build:
      context: .
      dockerfile: data/pipelines/telemetry-kpi-daily/Dockerfile
    env_file:
      - .env
    environment:
      PIPELINE_CRON: "0 2 * * *"
    depends_on:
      - api
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: uis/trackflow-portal/Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - api

