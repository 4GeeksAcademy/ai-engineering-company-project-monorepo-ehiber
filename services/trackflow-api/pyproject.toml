[project]
name = "trackflow-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt<4.1",
  "tinydb>=4.8,<5.0",
]

[project.scripts]
seed = "seed:run_seed"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
