services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: ./services/trackflow-api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Force Docker network hostname (do not use localhost from host .env)
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-trackflow_knowledge}
      RAG_KNOWLEDGE_SOURCE_DIR: /workspace/docs/rag
      LITELLM_API_BASE: ${LITELLM_API_BASE:-https://openrouter.ai/api/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openrouter/perplexity/pplx-embed-v1-0.6b}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-openrouter/deepseek/deepseek-v4-flash}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1024}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      TRACKFLOW_ALLOWED_ORIGINS: ${TRACKFLOW_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      PYTHONPATH: /app:/workspace/services/trackflow-api:/workspace/services:/workspace/data/pipelines/telemetry-kpi-daily:/workspace/data/pipelines
      # Local Docker inventory DB (avoids broken remote pooler). Set DOCKER_SUPABASE_URI to use real Supabase.
      SUPABASE_URI: ${DOCKER_SUPABASE_URI:-sqlite:////tmp/trackflow-inventory.db}
    ports:
      - "8000:8000"
    volumes:
      - ./services/trackflow-api:/app
      - .:/workspace
    working_dir: /app
    command: ["/opt/venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - redis
      - qdrant

  rag-index:
    build: ./services/trackflow-api
    profiles: ["rag"]
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-trackflow_knowledge}
      RAG_KNOWLEDGE_SOURCE_DIR: /workspace/docs/rag
      LITELLM_API_BASE: ${LITELLM_API_BASE:-https://openrouter.ai/api/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openrouter/perplexity/pplx-embed-v1-0.6b}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-openrouter/deepseek/deepseek-v4-flash}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1024}
      PYTHONPATH: /workspace/services/trackflow-api
    volumes:
      - .:/workspace
    working_dir: /workspace/services/trackflow-api
    command: ["/opt/venv/bin/python", "/workspace/scripts/index_knowledge_base.py", "--recreate"]
    depends_on:
      - qdrant

  celery-worker:
    build: ./services/trackflow-api
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /workspace/services/trackflow-api
    working_dir: /workspace/services/trackflow-api
    volumes:
      - .:/workspace
    command: ["/opt/venv/bin/celery", "-A", "trackflow_api.worker", "worker", "--loglevel=info"]
    depends_on:
      - redis
      - api
    restart: unless-stopped

  flower:
    build: ./services/trackflow-api
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      FLOWER_PORT: ${FLOWER_PORT:-5555}
      PYTHONPATH: /workspace/services/trackflow-api
    working_dir: /workspace/services/trackflow-api
    volumes:
      - .:/workspace
    command: ["/opt/venv/bin/celery", "-A", "trackflow_api.worker", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: uis/backoffice/Dockerfile
      args:
        NEXT_PUBLIC_TRACKFLOW_API_URL: ${NEXT_PUBLIC_TRACKFLOW_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_TRACKFLOW_API_URL: ${NEXT_PUBLIC_TRACKFLOW_API_URL:-http://localhost:8000}
    ports:
      - "3002:3000"
    depends_on:
      - api

  telemetry-pipeline:
    build:
      context: .
      dockerfile: data/pipelines/telemetry-kpi-daily/Dockerfile
    image: trackflow-telemetry-pipeline:latest
    env_file:
      - .env
    environment:
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-trackflow-docker-pool}
      PREFECT_WORKER_TYPE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
    restart: unless-stopped

  nightly-telemetry:
    build:
      context: .
      dockerfile: scripts/Dockerfile.nightly-telemetry
    env_file:
      - .env
    volumes:
      - ./data/raw:/app/data/raw
    depends_on:
      - api
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: uis/trackflow-portal/Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  qdrant_data:

