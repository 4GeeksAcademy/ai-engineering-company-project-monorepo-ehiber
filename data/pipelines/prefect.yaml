# Prefect deployment — TrackFlow telemetry KPI daily pipeline
# Setup (once):
#   prefect cloud login
#   prefect work-pool create --type docker trackflow-docker-pool
#   prefect deploy --all --prefect-file data/pipelines/prefect.yaml
name: trackflow-telemetry
prefect-version: ">=3.0.0"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

definitions:
  work_pools:
    docker_pool: &docker_pool
      name: trackflow-docker-pool
      job_variables:
        image: trackflow-telemetry-pipeline:latest
        env:
          SUPABASE_URI: "{{ $SUPABASE_URI }}"

deployments:
  - name: telemetry-kpi-daily-scheduled
    entrypoint: data/pipelines/pipeline.py:telemetry_kpi_daily_flow
    work_pool: *docker_pool
    # Schedule disabled: nightly orchestration runs via scripts/nightly_telemetry.py
    # (docker-compose service `nightly-telemetry`, cron 0 2 * * * UTC).
    parameters:
      triggered_by: scheduler
      force: false
    description: >
      Legacy scheduled deployment name — use nightly-telemetry cron instead.

  - name: telemetry-kpi-daily-manual
    entrypoint: data/pipelines/pipeline.py:telemetry_kpi_daily_flow
    work_pool: *docker_pool
    parameters:
      triggered_by: manual
      force: false
    description: On-demand telemetry KPI daily pipeline run.
