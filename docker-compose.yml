services:
  api:
    build: ./services/trackflow-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/trackflow-api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  backoffice:
    build:
      context: .
      dockerfile: uis/backoffice/Dockerfile
    ports:
      - "3002:3000"
    depends_on:
      - api

  telemetry-pipeline:
    build:
      context: .
      dockerfile: data/pipelines/telemetry-kpi-daily/Dockerfile
    image: trackflow-telemetry-pipeline:latest
    env_file:
      - .env
    environment:
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-trackflow-docker-pool}
      PREFECT_WORKER_TYPE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
    restart: unless-stopped

  nightly-telemetry:
    build:
      context: .
      dockerfile: scripts/Dockerfile.nightly-telemetry
    env_file:
      - .env
    volumes:
      - ./data/raw:/app/data/raw
    depends_on:
      - api
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: uis/trackflow-portal/Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - api

