[project]
name = "trackflow-mcp"
version = "0.1.0"
description = "TrackFlow MCP server (Variant B) — OAuth via MCP Auth library"
requires-python = ">=3.11"
dependencies = [
  "mcpauth>=0.1.1,<0.2",
  "mcp[cli]>=1.6,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "starlette>=0.37,<1.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
  "sqlmodel>=0.0.22,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "tinydb>=4.8,<5.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt<4.1",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
trackflow-mcp = "trackflow_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trackflow_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
